<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroPad Configurator</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --accent: #4f8cff;
            --text: #ffffff;
            --border: #30363d;
        }
        body {
            margin: 0; font-family: 'Pretendard', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh;
        }
        /* 헤더 - 큼직한 버튼 */
        header {
            padding: 20px 40px; background: #010409;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border);
        }
        .btn {
            padding: 12px 24px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-danger { background: #da3633; color: white; }

        main { display: flex; flex: 1; overflow: hidden; }

        /* 왼쪽: 3x3 키 배열 (가장 크게 배치) */
        .keypad-section {
            flex: 1.5; display: flex; flex-direction: column; align-items: center;
            justify-content: center; background: radial-gradient(circle, #1c212e 0%, #0b0e14 100%);
            padding: 20px;
        }
        .layer-selector { display: flex; gap: 15px; margin-bottom: 40px; }
        .layer-btn {
            padding: 15px 35px; border-radius: 10px; background: var(--card);
            border: 2px solid var(--border); color: #888; cursor: pointer; font-size: 18px; font-weight: 800;
        }
        .layer-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79, 140, 255, 0.1); }

        .grid-3x3 {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            width: 100%; max-width: 500px;
        }
        .key-cap {
            aspect-ratio: 1/1; background: var(--card); border: 3px solid var(--border);
            border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
        }
        .key-cap:hover { transform: translateY(-5px); border-color: var(--accent); }
        .key-cap.active { border-color: var(--accent); background: #1f2937; box-shadow: 0 0 20px rgba(79, 140, 255, 0.4); }
        .key-cap .num { font-size: 14px; color: #555; margin-bottom: 10px; }
        .key-cap .val { font-size: 22px; font-weight: 900; color: var(--accent); }

        /* 오른쪽: 설정 패널 */
        .config-panel {
            width: 450px; background: var(--card); border-left: 2px solid var(--border);
            padding: 40px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto;
        }
        .section { display: flex; flex-direction: column; gap: 15px; }
        .section-label { font-size: 14px; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        label { font-size: 16px; font-weight: 600; }
        select, input {
            padding: 15px; border-radius: 10px; background: #000;
            border: 2px solid var(--border); color: white; font-size: 18px;
        }
        .footer-btns { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

        @media (max-width: 1100px) {
            main { flex-direction: column; }
            .config-panel { width: 100%; border-left: none; border-top: 2px solid var(--border); }
        }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <span style="font-size: 24px; font-weight: 900;">MACRO<span style="color:var(--accent)">PAD</span></span>
        <span id="conn-indicator" style="font-size: 14px; color: #da3633;">● 연결되지 않음</span>
    </div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-outline" onclick="triggerFileInput()">설정 불러오기</button>
        <button class="btn btn-outline" onclick="saveToFile()">파일로 저장</button>
        <button id="conn-btn" class="btn btn-primary" onclick="connectDevice()">기기 연결</button>
    </div>
</header>

<main>
    <div class="keypad-section">
        <div class="layer-selector">
            <button class="layer-btn active" onclick="setLayer(0)">LAYER 0</button>
            <button class="layer-btn" onclick="setLayer(1)">LAYER 1</button>
            <button class="layer-btn" onclick="setLayer(2)">LAYER 2</button>
            <button class="layer-btn" onclick="setLayer(3)">LAYER 3</button>
        </div>
        <div class="grid-3x3" id="main-grid">
            </div>
        <div id="status-msg" style="margin-top:40px; color:#555; font-size:16px;">수정할 키를 선택하세요.</div>
    </div>

    <div class="config-panel">
        <div class="section">
            <div class="section-label">Key Configuration</div>
            <h2 id="selected-key-label" style="margin:0;">키 설정: K1</h2>
            
            <label>동작 유형</label>
            <select id="action-type" onchange="updateActionUI()">
                <option value="1">일반 단축키</option>
                <option value="2">조합 키 (Modifier)</option>
                <option value="3">매크로 문구</option>
                <option value="4">미디어 제어</option>
            </select>

            <label>입력 값</label>
            <input type="text" id="action-val" placeholder="예: 0x04">
        </div>

        <div class="section" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px;">
            <div class="section-label">Device System</div>
            <label>부저음 크기</label>
            <input type="range" min="0" max="100" value="50" id="buzzer-range">
            <button class="btn btn-outline" onclick="alert('부저 테스트 신호를 보냅니다.')">소리 테스트</button>
        </div>

        <div class="footer-btns">
            <button class="btn btn-primary" style="padding: 20px; font-size: 20px;" onclick="applyToState()">기기에 설정 적용</button>
            <button class="btn btn-danger" style="opacity:0.7" onclick="alert('펌웨어 업데이트 서버 확인 중...')">펌웨어 업그레이드</button>
        </div>
    </div>
</main>

<input type="file" id="hidden-file" style="display:none" onchange="loadFromFile(event)">

<script>
    let port, writer;
    let state = {
        currentLayer: 0,
        selectedIndex: 0,
        layers: Array.from({ length: 4 }, () => 
            Array.from({ length: 9 }, () => ({ type: "1", val: "0x04" }))
        )
    };

    // 1. 그리드 생성 (3x3)
    function renderGrid() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const keyData = state.layers[state.currentLayer][i];
            const div = document.createElement('div');
            div.className = `key-cap ${state.selectedIndex === i ? 'active' : ''}`;
            div.innerHTML = `
                <span class="num">KEY ${i+1}</span>
                <span class="val">${keyData.val}</span>
            `;
            div.onclick = () => {
                state.selectedIndex = i;
                loadKeyToUI();
                renderGrid();
            };
            grid.appendChild(div);
        }
    }

    // 2. 레이어 선택
    function setLayer(l) {
        state.currentLayer = l;
        document.querySelectorAll('.layer-btn').forEach((b, i) => b.classList.toggle('active', i === l));
        renderGrid();
        loadKeyToUI();
    }

    // 3. UI에 키 데이터 로드
    function loadKeyToUI() {
        const key = state.layers[state.currentLayer][state.selectedIndex];
        document.getElementById('selected-key-label').innerText = `키 설정: K${state.selectedIndex + 1}`;
        document.getElementById('action-type').value = key.type;
        document.getElementById('action-val').value = key.val;
    }

    // 4. 적용 버튼 (기기 전송 시뮬레이션)
    function applyToState() {
        const key = state.layers[state.currentLayer][state.selectedIndex];
        key.type = document.getElementById('action-type').value;
        key.val = document.getElementById('action-val').value;
        renderGrid();
        
        if (writer) {
            const cmd = JSON.stringify({ cmd: "SET", layer: state.currentLayer, pos: state.selectedIndex, data: key });
            writer.write(new TextEncoder().encode(cmd + "\n"));
        }
        alert(`K${state.selectedIndex + 1} 설정이 적용되었습니다.`);
    }

    // 5. 시리얼 연결
    async function connectDevice() {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            writer = port.writable.getWriter();
            document.getElementById('conn-indicator').innerText = "● 기기 연결됨";
            document.getElementById('conn-indicator').style.color = "#4f8cff";
            document.getElementById('conn-btn').innerText = "연결 완료";
        } catch (e) { alert("연결 실패"); }
    }

    // 6. 파일 저장/불러오기
    function saveToFile() {
        const blob = new Blob([JSON.stringify(state)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = "keymap.json"; a.click();
    }
    function triggerFileInput() { document.getElementById('hidden-file').click(); }
    function loadFromFile(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            state = JSON.parse(ev.target.result);
            renderGrid();
            loadKeyToUI();
        };
        reader.readAsText(file);
    }

    // 초기화
    renderGrid();
    loadKeyToUI();
</script>
</body>
</html>
