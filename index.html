<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매크로패드 프로 설정러</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(30, 34, 51, 0.8);
            --accent: #4f8cff;
            --danger: #ff4f4f;
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* 헤더: 높이 상향 및 글자 크기 확대 */
        header {
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            background: #161925; border-bottom: 2px solid var(--border);
        }
        .logo { font-weight: 900; font-size: 24px; color: var(--accent); }

        /* 버튼: 전체적으로 크기 확대 */
        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 16px; transition: 0.2s;
        }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-danger { border: 2px solid var(--danger); color: var(--danger); background: transparent; }

        main { display: flex; flex: 1; overflow: hidden; }

        /* 키패드 영역: 꽉 차는 디자인 */
        .canvas {
            flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(circle at center, #1e2233 0%, #0f111a 100%);
        }

        .layer-tabs { display: flex; gap: 12px; margin-bottom: 40px; }
        .tab {
            padding: 12px 30px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold;
            background: rgba(255,255,255,0.05); color: #888; transition: 0.3s;
        }
        .tab.active { background: var(--accent); color: white; transform: scale(1.1); }

        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;
            max-width: 500px; width: 100%;
        }
        .key-node {
            aspect-ratio: 1/1; background: var(--panel-bg); border: 3px solid var(--border);
            border-radius: 25px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; transition: 0.2s;
        }
        .key-node:hover { border-color: var(--accent); background: rgba(79,140,255,0.1); }
        .key-node.active { border-color: var(--accent); background: rgba(79,140,255,0.2); transform: scale(1.05); box-shadow: 0 0 30px rgba(79,140,255,0.3); }
        .key-id { font-size: 14px; opacity: 0.5; margin-bottom: 8px; }
        .key-val { font-size: 20px; font-weight: 800; color: var(--accent); }

        /* 우측 설정창: 넓게 확장 */
        .inspector {
            width: 400px; background: #161925; border-left: 2px solid var(--border);
            padding: 40px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto;
        }

        .section-title { font-size: 14px; color: var(--accent); font-weight: 800; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        h3 { font-size: 24px; margin: 0; }

        .form-group { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 15px; font-weight: bold; color: #bbb; }
        select, input {
            background: #000; border: 2px solid var(--border); color: white;
            padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold;
        }
        select:focus, input:focus { border-color: var(--accent); outline: none; }

        @media (max-width: 1000px) {
            main { flex-direction: column; }
            .inspector { width: 100%; height: auto; border-left: none; border-top: 2px solid var(--border); }
            .grid-container { max-width: 300px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MACROPAD <span style="color:white">PRO</span></div>
    <div style="display: flex; gap: 15px;">
        <button id="load-btn" class="btn btn-outline">열기</button>
        <button id="save-file-btn" class="btn btn-outline">파일저장</button>
        <button id="connect-btn" class="btn">기기 연결</button>
        <button id="disconnect-btn" class="btn btn-danger" style="display:none">연결 해제</button>
    </div>
</header>

<main>
    <div class="canvas">
        <div class="layer-tabs">
            <div class="tab active" onclick="changeLayer(0)">L0</div>
            <div class="tab" onclick="changeLayer(1)">L1</div>
            <div class="tab" onclick="changeLayer(2)">L2</div>
            <div class="tab" onclick="changeLayer(3)">L3</div>
        </div>
        <div class="grid-container" id="key-grid"></div>
        <div id="status-msg" style="margin-top: 30px; font-size: 16px; font-weight: bold; color: #555;">기기를 연결해주세요.</div>
    </div>

    <div class="inspector">
        <div>
            <div class="section-title">KEY CONFIG</div>
            <h3 id="edit-title">Key K1</h3>
            <p style="color:#666; font-size:14px; margin-top:5px;">레이어별 동작을 설정합니다.</p>
        </div>
        
        <div class="form-group">
            <label>동작 선택</label>
            <select id="type-select">
                <option value="1">일반 단축키</option>
                <option value="2">조합키 (Ctrl/Alt/Shift)</option>
                <option value="3">매크로 문구</option>
                <option value="4">미디어/시스템</option>
            </select>
        </div>

        <div class="form-group">
            <label id="val-label">키 선택</label>
            <select id="keycode-preset">
                </select>
            <input type="text" id="val-input" style="display:none;" placeholder="텍스트 입력">
        </div>

        <button id="apply-btn" class="btn" style="width: 100%; padding: 20px; font-size: 20px;">기기에 설정 적용</button>

        <div class="section-title">SYSTEM</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" style="flex:1" onclick="alert('부저음 테스트')">소리 확인</button>
            <button class="btn btn-danger" style="flex:1" onclick="alert('펌웨어 모드 진입')">업데이트</button>
        </div>
    </div>
</main>

<input type="file" id="file-input" style="display:none" accept=".json">

<script>
    // --- 단축키 프리셋 데이터 ---
    const KEY_PRESETS = {
        1: [ // 일반 키
            {n: "A", v: "0x04"}, {n: "B", v: "0x05"}, {n: "C", v: "0x06"}, {n: "Enter", v: "0x28"},
            {n: "Esc", v: "0x29"}, {n: "Space", v: "0x2C"}, {n: "F1", v: "0x3A"}, {n: "F5", v: "0x3E"}
        ],
        2: [ // 조합 키
            {n: "Ctrl + C (복사)", v: "0x01,0x06"}, {n: "Ctrl + V (붙여넣기)", v: "0x01,0x19"},
            {n: "Ctrl + Z (되돌리기)", v: "0x01,0x1D"}, {n: "Win + L (잠금)", v: "0x08,0x0F"}
        ],
        4: [ // 미디어
            {n: "볼륨 업", v: "0xE9"}, {n: "볼륨 다운", v: "0xEA"}, {n: "재생/일시정지", v: "0xCD"}, {n: "다음 곡", v: "0xB5"}
        ]
    };

    let port, writer;
    let state = {
        currentLayer: 0,
        selectedIndex: 0,
        layers: Array.from({ length: 4 }, () => Array.from({ length: 9 }, () => ({ type: 1, val: "0x04" })))
    };

    function renderGrid() {
        const grid = document.getElementById('key-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const key = state.layers[state.currentLayer][i];
            const node = document.createElement('div');
            node.className = `key-node ${state.selectedIndex === i ? 'active' : ''}`;
            node.innerHTML = `<span class="key-id">K${i+1}</span><span class="key-val">${key.val}</span>`;
            node.onclick = () => { state.selectedIndex = i; updateInspector(); renderGrid(); };
            grid.appendChild(node);
        }
    }

    function updateInspector() {
        const key = state.layers[state.currentLayer][state.selectedIndex];
        document.getElementById('edit-title').innerText = `Key K${state.selectedIndex + 1}`;
        document.getElementById('type-select').value = key.type;
        
        const presetSelect = document.getElementById('keycode-preset');
        const valInput = document.getElementById('val-input');

        if (key.type == 3) {
            presetSelect.style.display = "none";
            valInput.style.display = "block";
            valInput.value = key.val;
        } else {
            presetSelect.style.display = "block";
            valInput.style.display = "none";
            
            // 프리셋 옵션 채우기
            presetSelect.innerHTML = '';
            (KEY_PRESETS[key.type] || []).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.v; opt.innerText = p.n;
                if(p.v === key.val) opt.selected = true;
                presetSelect.appendChild(opt);
            });
        }
    }

    // 레이어 변경
    function changeLayer(idx) {
        state.currentLayer = idx;
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
        renderGrid();
    }

    // 타입 변경 시 UI 전환
    document.getElementById('type-select').onchange = (e) => {
        state.layers[state.currentLayer][state.selectedIndex].type = e.target.value;
        updateInspector();
    };

    // 적용 버튼
    document.getElementById('apply-btn').onclick = () => {
        const key = state.layers[state.currentLayer][state.selectedIndex];
        key.val = (key.type == 3) ? document.getElementById('val-input').value : document.getElementById('keycode-preset').value;
        renderGrid();
        alert("기기에 전송되었습니다!");
    };

    // 기기 연결
    document.getElementById('connect-btn').onclick = async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            document.getElementById('connect-btn').style.display = "none";
            document.getElementById('disconnect-btn').style.display = "block";
            document.getElementById('status-msg').innerText = "기기가 연결되었습니다.";
            document.getElementById('status-msg').style.color = var(--accent);
        } catch(e) {}
    };

    renderGrid();
    updateInspector();
</script>
</body>
</html>
