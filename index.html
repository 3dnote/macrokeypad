<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroKeypad Configurator Pro</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(30, 34, 51, 0.7);
            --accent: #4f8cff;
            --text: #e0e6ed;
            --border: rgba(255, 255, 255, 0.1);
            --frosted: blur(10px);
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 17, 26, 0.8); backdrop-filter: var(--frosted); border-bottom: 1px solid var(--border);
        }
        .btn {
            background: var(--accent); color: white; border: none; padding: 8px 16px;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn:disabled { background: #444; opacity: 0.5; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* --- Main Layout --- */
        main {
            display: flex; flex: 1; overflow: hidden;
        }

        /* Sidebar (PC Only) */
        .sidebar {
            width: 240px; border-right: 1px solid var(--border); padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }
        @media (max-width: 900px) { .sidebar { display: none; } }

        /* Canvas (Keypad Area) */
        .canvas {
            flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; background: radial-gradient(circle at center, #1e2233 0%, #0f111a 100%);
        }

        /* Layer Tabs */
        .layer-tabs {
            display: flex; gap: 10px; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px;
        }
        .tab {
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .tab.active { background: var(--accent); box-shadow: 0 4px 15px rgba(79, 140, 255, 0.4); }

        /* Key Grid */
        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            max-width: 400px; width: 100%;
        }
        .key-node {
            aspect-ratio: 1/1; background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 15px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; transition: 0.2s; text-align: center; padding: 10px;
        }
        .key-node:hover { border-color: var(--accent); transform: translateY(-2px); }
        .key-node.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(79,140,255,0.2); background: rgba(79,140,255,0.1); }
        .key-id { font-size: 10px; opacity: 0.5; margin-bottom: 5px; }
        .key-val { font-size: 13px; font-weight: bold; word-break: break-all; }

        /* Inspector (Right Side) */
        .inspector {
            width: 320px; background: var(--panel-bg); backdrop-filter: var(--frosted);
            border-left: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 20px;
        }

        /* --- Mobile Specific (Bottom Sheet) --- */
        @media (max-width: 900px) {
            main { flex-direction: column; }
            .inspector {
                position: fixed; bottom: 0; left: 0; width: 100%; height: 50vh;
                border-left: none; border-top: 1px solid var(--border);
                border-radius: 25px 25px 0 0; z-index: 100; transform: translateY(0);
                padding: 20px; box-sizing: border-box;
            }
            .canvas { padding: 20px; padding-bottom: 55vh; }
        }

        /* --- Form Elements --- */
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; color: #888; }
        select, input {
            background: #0b0d12; border: 1px solid var(--border); color: white;
            padding: 10px; border-radius: 6px; outline: none;
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 18px;">MacroKeypad <span id="fw-ver" style="font-size: 10px; opacity: 0.5;">v0.4.1</span></div>
    <div style="display: flex; gap: 10px;">
        <button id="connect-btn" class="btn">기기 연결</button>
        <button id="disconnect-btn" class="btn btn-outline" disabled>해제</button>
    </div>
</header>

<main>
    <div class="sidebar">
        <label>Key List (Drag to Key)</label>
        <input type="text" id="search-key" placeholder="검색: A, F1, Alt...">
        <div id="key-list-scroll" style="flex:1; overflow-y:auto; font-size: 13px;">
            </div>
    </div>

    <div class="canvas">
        <div class="layer-tabs" id="layer-tabs">
            <div class="tab active" onclick="changeLayer(0)">Layer 0</div>
            <div class="tab" onclick="changeLayer(1)">Layer 1</div>
            <div class="tab" onclick="changeLayer(2)">Layer 2</div>
            <div class="tab" onclick="changeLayer(3)">Layer 3</div>
        </div>
        
        <div class="grid-container" id="key-grid">
            </div>

        <div style="margin-top: 25px; width: 100%; max-width: 400px; display: flex; gap: 10px;">
            <div class="key-node" style="flex:1; aspect-ratio: auto; height: 60px;" id="enc-cw">
                <span class="key-id">ENC CW</span><span class="key-val">PgUp</span>
            </div>
            <div class="key-node" style="flex:1; aspect-ratio: auto; height: 60px;" id="enc-ccw">
                <span class="key-id">ENC CCW</span><span class="key-val">PgDn</span>
            </div>
        </div>
    </div>

    <div class="inspector">
        <h3 id="edit-title" style="margin-top:0">Key Edit (K1)</h3>
        
        <div class="form-group">
            <label>Type</label>
            <select id="type-select">
                <option value="1">단일 키</option>
                <option value="2">조합 키 (Modifier)</option>
                <option value="3">매크로 (Text)</option>
                <option value="4">미디어 키</option>
            </select>
        </div>

        <div id="key-select-area" class="form-group">
            <label>Key Select</label>
            <select id="primary-key-select"></select>
        </div>

        <div id="macro-area" class="form-group" style="display:none">
            <label>Macro String</label>
            <input type="text" id="macro-input" placeholder="Enter text...">
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" id="apply-btn" style="width: 100%;">기기에 적용</button>
            <button class="btn btn-outline" id="save-file-btn">파일로 저장</button>
        </div>
    </div>
</main>

<script>
    let state = {
        currentLayer: 0,
        layers: Array.from({ length: 4 }, () => Array.from({ length: 11 }, () => ({ type: 1, key: '', macro: '' })))
    };

    function setLayer(idx, name) {
        state.currentLayer = idx;
        document.querySelectorAll('.layer-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
        document.getElementById('target-layer').innerText = `현재 레이어: LAYER ${idx} (${name})`;
        renderKeys();
    }

    function renderKeys() {
        const grid = document.getElementById('key-grid');
        grid.innerHTML = '';
        state.layers[state.currentLayer].forEach((key, i) => {
            const div = document.createElement('div');
            div.className = `key ${i === 2 ? 'active' : ''}`;
            div.innerHTML = `<span class="k-id">K${i + 1}</span><span class="k-val">${key.macro || key.key || 'Key'}</span>`;
            div.onclick = () => {
                document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
                div.classList.add('active');
                document.getElementById('target-key').innerText = `편집 중: KEY ${i + 1}`;
            };
            grid.appendChild(div);
        });
    }

    async function connect() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            console.log('Device connected');
        } catch (e) {
            console.error('Connection failed', e);
        }
    }

    function saveToFile() {
        const blob = new Blob([JSON.stringify(state.layers)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'macrokeypad_config.json';
        a.click();
    }

    function loadFromFile(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                state.layers = JSON.parse(e.target.result);
                renderKeys();
            };
            reader.readAsText(file);
        }
    }

    document.querySelector('.btn-file').addEventListener('click', saveToFile);
    document.getElementById('file-input').addEventListener('change', loadFromFile);

    renderKeys();
</script>
</body>
</html>
