<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroKeypad Configurator Pro</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;
            --danger: #f85149;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body {
            margin: 0; padding: 0; font-family: 'Pretendard', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; /* 스크롤 방지 */
        }

        /* 헤더: 높이를 줄여 본문 공간 확보 */
        header {
            padding: 10px 20px; background: #010409;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            height: 50px;
        }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .fw-info { font-size: 12px; opacity: 0.7; margin-left: 10px; background: #21262d; padding: 2px 8px; border-radius: 10px; }

        .btn-group { display: flex; gap: 8px; }
        .btn {
            padding: 6px 12px; border-radius: 6px; border: none; font-size: 13px; 
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        /* 메인 구성: 3단 분할 또는 가로 분할 */
        main { display: flex; flex: 1; overflow: hidden; }

        /* 좌측: 키 배열 (영역 확대) */
        .keypad-section {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1c212e 0%, #0d1117 100%);
            padding: 20px;
        }

        .layer-tabs { display: flex; gap: 8px; margin-bottom: 25px; }
        .tab {
            padding: 8px 20px; border-radius: 8px; background: var(--card);
            border: 1px solid var(--border); color: #888; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(88, 166, 255, 0.1); }

        .grid-3x3 {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 420px; /* 너무 커지지 않게 제한 */
        }
        .key {
            aspect-ratio: 1/1; background: var(--card); border: 2px solid var(--border);
            border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .key:hover { border-color: var(--accent); }
        .key.active { border-color: var(--accent); background: #1f2937; box-shadow: 0 0 15px rgba(88, 166, 255, 0.2); }
        .key-id { font-size: 11px; color: #555; margin-bottom: 5px; }
        .key-val { font-size: 16px; font-weight: 800; color: var(--accent); text-align: center; }

        /* 우측: 설정 패널 (폭 최적화) */
        .side-panel {
            width: 360px; background: #0d1117; border-left: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
        }

        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .card-title { font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; }

        .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .field label { font-size: 13px; font-weight: 600; color: #8b949e; }
        select, input[type="text"] {
            padding: 10px; border-radius: 6px; background: #010409;
            border: 1px solid var(--border); color: white; font-size: 14px;
        }

        /* 아래쪽 고정 버튼 */
        .bottom-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
        .btn-big { padding: 15px; font-size: 16px; width: 100%; border-radius: 10px; }

    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <span class="logo-text">MACRO<span style="color:var(--accent)">KEYPAD</span></span>
        <span class="fw-info">v1.2.0</span>
        <button class="btn btn-outline" style="font-size: 10px; padding: 2px 6px;" onclick="location.reload()">새로고침</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-outline">파일 열기</button>
        <button class="btn btn-outline">저장</button>
        <button class="btn btn-primary" onclick="connect()">기기 연결</button>
    </div>
</header>

<main>
    <div class="keypad-section">
        <div class="layer-tabs">
            <div class="tab active">LAYER 0</div>
            <div class="tab">LAYER 1</div>
            <div class="tab">LAYER 2</div>
            <div class="tab">LAYER 3</div>
        </div>
        <div class="grid-3x3" id="grid">
            <script>
                for(let i=1; i<=9; i++) {
                    document.write(`
                        <div class="key ${i==1?'active':''}" onclick="selectKey(${i})">
                            <span class="key-id">K${i}</span>
                            <span class="key-val">A</span>
                        </div>
                    `);
                }
            </script>
        </div>
        <p style="margin-top: 20px; font-size: 12px; color: #555;">수정할 키를 선택하세요.</p>
    </div>

    <div class="side-panel">
        <div class="card">
            <div class="card-title">Key Mapping</div>
            <h3 id="key-name" style="margin: 0 0 15px 0; font-size: 18px;">편집 중: KEY 1</h3>
            <div class="field">
                <label>동작 유형</label>
                <select>
                    <option>단일키 (Single Key)</option>
                    <option>조합키 (Modifier)</option>
                    <option>매크로 (Macro)</option>
                    <option>미디어 (Media)</option>
                </select>
            </div>
            <div class="field">
                <label>키 설정 값</label>
                <input type="text" value="A">
            </div>
            <button class="btn btn-primary" style="width: 100%;">편집 적용</button>
        </div>

        <div class="card">
            <div class="card-title">System & Sound</div>
            <div class="field">
                <label>부저 볼륨</label>
                <input type="range" style="width: 100%;">
            </div>
            <div style="display: flex; gap: 5px;">
                <button class="btn btn-outline" style="flex:1">설정 읽기</button>
                <button class="btn btn-outline" style="flex:1">초기화</button>
            </div>
        </div>

        <div class="bottom-actions">
            <button class="btn btn-primary btn-big" style="background:#2ea44f;">기기에 적용 (SAVE)</button>
            <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);">펌웨어 업데이트</button>
        </div>
    </div>
</main>

<script>
    function selectKey(id) {
        document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('key-name').innerText = "편집 중: KEY " + id;
    }
    async function connect() {
        try { await navigator.serial.requestPort(); } catch(e) {}
    }
</script>
</body>
</html>
