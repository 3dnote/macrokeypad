<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroKeypad Configurator Pro</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(30, 34, 51, 0.7);
            --accent: #4f8cff;
            --text: #e0e6ed;
            --border: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; font-family: sans-serif; background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 17, 26, 0.8); border-bottom: 1px solid var(--border); }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        main { display: flex; flex: 1; overflow: hidden; }
        
        /* Canvas */
        .canvas { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; }
        .key-node { background: var(--panel-bg); border: 2px solid var(--border); border-radius: 12px; aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .key-node.active { border-color: var(--accent); background: rgba(79, 140, 255, 0.1); }
        
        /* Inspector */
        .inspector { width: 300px; background: #161925; border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        select, input { background: #0b0d12; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 4px; }
        
        @media (max-width: 800px) {
            main { flex-direction: column; }
            .inspector { width: 100%; border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">MacroKeypad <span id="status-dot" style="color: gray;">●</span></div>
    <div style="display: flex; gap: 10px;">
        <button id="connect-btn" class="btn">기기 연결</button>
        <button id="disconnect-btn" class="btn" style="background:#444" disabled>해제</button>
    </div>
</header>

<main>
    <div class="canvas">
        <div style="margin-bottom: 20px; display: flex; gap: 5px;">
            <button class="btn btn-layer active" onclick="setLayer(0)">L0</button>
            <button class="btn btn-layer" onclick="setLayer(1)">L1</button>
            <button class="btn btn-layer" onclick="setLayer(2)">L2</button>
            <button class="btn btn-layer" onclick="setLayer(3)">L3</button>
        </div>
        <div class="grid" id="key-grid"></div>
        <div id="status-msg" style="margin-top: 20px; font-size: 12px; color: #888;">기기를 연결해주세요.</div>
    </div>

    <div class="inspector">
        <h3 id="edit-label">Key K1</h3>
        <div class="form-group">
            <label>Type</label>
            <select id="type-select">
                <option value="1">Normal Key</option>
                <option value="2">Modifier Combo</option>
                <option value="3">Macro (Text)</option>
                <option value="4">Media Key</option>
            </select>
        </div>
        <div id="val-area" class="form-group">
            <label>Keycode (Hex)</label>
            <input type="text" id="val-input" placeholder="0x04">
        </div>
        <button id="apply-btn" class="btn" style="width: 100%; margin-top: 10px;">저장 (Apply)</button>
        <button id="fetch-btn" class="btn" style="width: 100%; background:#555;">기기값 읽어오기</button>
    </div>
</main>

<script>
    // --- 통신 관련 변수 ---
    let port, reader, writer;
    let rxBuffer = "";
    let state = {
        currentLayer: 0,
        selectedIndex: 0,
        layers: Array.from({ length: 4 }, () => Array.from({ length: 11 }, () => ({ type: 1, key1: 0, key2: 0, macro: "" })))
    };

    // --- UI 초기화 ---
    function initGrid() {
        const grid = document.getElementById('key-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const node = document.createElement('div');
            node.className = `key-node ${state.selectedIndex === i ? 'active' : ''}`;
            node.innerHTML = `<small>K${i+1}</small><strong>${state.layers[state.currentLayer][i].type === 3 ? 'M' : '0x' + state.layers[state.currentLayer][i].key1.toString(16)}</strong>`;
            node.onclick = () => { state.selectedIndex = i; updateUI(); };
            grid.appendChild(node);
        }
    }

    function updateUI() {
        document.getElementById('edit-label').innerText = `Key K${state.selectedIndex + 1}`;
        const currentKey = state.layers[state.currentLayer][state.selectedIndex];
        document.getElementById('type-select').value = currentKey.type;
        document.getElementById('val-input').value = currentKey.type === 3 ? currentKey.macro : '0x' + currentKey.key1.toString(16);
        initGrid();
    }

    function setLayer(l) {
        state.currentLayer = l;
        document.querySelectorAll('.btn-layer').forEach((b, i) => b.classList.toggle('active', i === l));
        updateUI();
    }

    // --- Web Serial 핵심 로직 ---
    async function connect() {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            writer = port.writable.getWriter();
            document.getElementById('connect-btn').disabled = true;
            document.getElementById('disconnect-btn').disabled = false;
            document.getElementById('status-dot').style.color = '#4f8cff';
            readLoop();
            msg("연결되었습니다.");
        } catch (e) { console.error(e); msg("연결 실패: " + e.message); }
    }

    async function readLoop() {
        const decoder = new TextDecoder();
        while (port.readable) {
            const reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    rxBuffer += decoder.decode(value);
                    if (rxBuffer.includes('\n')) {
                        console.log("RX:", rxBuffer.trim());
                        // 여기서 JSON 파싱 및 state 업데이트 로직 추가 가능
                        rxBuffer = "";
                    }
                }
            } catch (e) { break; } finally { reader.releaseLock(); }
        }
    }

    async function sendData() {
        if (!writer) return alert("기기를 먼저 연결하세요!");
        // 현재 로컬 state를 기기로 전송 (JSON 형식)
        const data = JSON.stringify({ layers: state.layers.map(l => ({keys: l})) });
        const encoder = new TextEncoder();
        await writer.write(encoder.encode(data + "\n"));
        msg("데이터 전송 완료!");
    }

    function msg(t) { document.getElementById('status-msg').innerText = t; }

    // 이벤트 리스너
    document.getElementById('connect-btn').onclick = connect;
    document.getElementById('apply-btn').onclick = sendData;
    document.getElementById('type-select').onchange = (e) => {
        state.layers[state.currentLayer][state.selectedIndex].type = parseInt(e.target.value);
        updateUI();
    };
    
    // 초기 렌더링
    updateUI();
</script>
</body>
</html>
