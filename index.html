<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroKeypad Manager</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;   /* 기기 관련: 파란색 */
            --warning: #d29922;  /* 파일 관련: 주황색 */
            --success: #238636;  /* 최종 적용: 초록색 */
            --danger: #da3633;   /* 해제/초기화: 빨간색 */
            --text: #ffffff;
            --border: #30363d;
        }

        body {
            margin: 0; font-family: 'Pretendard', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* 헤더 메뉴 그룹화 */
        header {
            padding: 20px 30px; background: #010409;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border);
        }
        
        .menu-section { display: flex; align-items: center; gap: 15px; }
        .group-label { font-size: 14px; font-weight: 800; color: #8b949e; margin-right: 5px; }

        .btn {
            padding: 12px 18px; border-radius: 8px; border: 2px solid transparent;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        
        /* 파일 그룹 버튼 */
        .btn-file { background: transparent; border-color: var(--warning); color: var(--warning); }
        .btn-file:hover { background: var(--warning); color: #000; }

        /* 기기 그룹 버튼 */
        .btn-device { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-device:hover { background: var(--accent); color: #fff; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        main { display: flex; flex: 1; overflow: hidden; }

        /* 좌측 키패드 (글자 크기 대폭 확대) */
        .visual-area {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; background: radial-gradient(circle, #1c212e 0%, #0d1117 100%);
        }
        .layer-title-bar { display: flex; gap: 10px; margin-bottom: 30px; }
        .layer-btn {
            padding: 15px 30px; border-radius: 12px; background: var(--card);
            border: 2px solid var(--border); font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .layer-btn.active { border-color: var(--accent); color: var(--accent); }

        .grid-3x3 {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            width: 100%; max-width: 550px;
        }
        .key {
            aspect-ratio: 1/1; background: var(--card); border: 4px solid var(--border);
            border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .key.active { border-color: var(--accent); box-shadow: 0 0 30px rgba(88, 166, 255, 0.3); }
        .key .val { font-size: 26px; font-weight: 900; color: var(--accent); }

        /* 우측 편집 패널 */
        .side-panel {
            width: 450px; background: #0d1117; padding: 35px;
            border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 30px;
        }
        .info-header { font-size: 28px; font-weight: 900; }
        .info-sub { font-size: 18px; color: #8b949e; margin-top: 5px; }

        .form-group { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 18px; font-weight: 700; }
        select, input {
            padding: 18px; border-radius: 12px; background: #000;
            border: 2px solid var(--border); color: #fff; font-size: 20px; font-weight: bold;
        }

        /* 하단 큰 저장 버튼 */
        .footer-save { margin-top: auto; }
        .btn-apply-final {
            width: 100%; padding: 25px; border-radius: 15px; background: var(--success);
            color: #fff; border: none; font-size: 22px; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="menu-section">
        <span class="group-label">💻 FILE</span>
        <button class="btn btn-file">파일 불러오기</button>
        <button class="btn btn-file">파일 저장하기</button>
    </div>

    <div class="menu-section">
        <span class="group-label">🎮 DEVICE</span>
        <button class="btn btn-device" onclick="connect()">기기 연결</button>
        <button class="btn btn-danger" onclick="disconnect()">연결 해제</button>
        <div style="width:2px; height:25px; background:var(--border)"></div>
        <button class="btn btn-device">기기에서 불러오기</button>
        <button class="btn btn-danger">기기 초기화</button>
    </div>
</header>

<main>
    <div class="visual-area">
        <div class="layer-title-bar">
            <button class="layer-btn active">LAYER 0 (문서용)</button>
            <button class="layer-btn">LAYER 1</button>
            <button class="layer-btn">LAYER 2</button>
        </div>
        <div class="grid-3x3">
            <script>
                for(let i=1; i<=9; i++) {
                    document.write(`
                        <div class="key ${i==3?'active':''}">
                            <span style="font-size:14px; margin-bottom:10px; opacity:0.5">K${i}</span>
                            <span class="val">${i==3?'MACRO':'A'}</span>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <div class="side-panel">
        <div>
            <div class="info-header">편집 중: KEY 3</div>
            <div class="info-sub">레이어: Layer 0 (문서용)</div>
        </div>

        <div class="form-group">
            <label>동작 타입 선택</label>
            <select>
                <option>단일키 (Single)</option>
                <option selected>매크로 (Macro)</option>
                <option>미디어 (Media)</option>
            </select>
        </div>

        <div class="form-group">
            <label>키/문구 설정</label>
            <input type="text" value="ab6IDcdefghikAB">
        </div>

        <div class="form-group">
            <label>부저 볼륨 (36%)</label>
            <input type="range" min="0" max="100" value="36" style="height:40px;">
        </div>

        <div class="footer-save">
            <button class="btn-apply-final">기기에 적용하기 (SAVE)</button>
            <p style="text-align: center; color: #555; margin-top: 15px; font-weight: bold;">최종 설정을 기기에 전송합니다.</p>
        </div>
    </div>
</main>

<script>
    function connect() { alert("기기 탐색을 시작합니다."); }
    function disconnect() { alert("기기 연결을 해제했습니다."); }
</script>
</body>
</html>
